<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>雷雨危険度モニター</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
}

header{
    background:#1565c0;
    color:white;
    padding:12px;
    text-align:center;
}

.container{
    padding:10px;
}

.card{
    background:white;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.2);
}

.safe{
    background:#d4edda;
}

.warning{
    background:#fff3cd;
}

.danger{
    background:#f8d7da;
}

button{
    padding:10px;
    margin:3px;
    border:none;
    border-radius:5px;
    background:#1565c0;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

#map{
    height:50vh;
    border-radius:8px;
}

.value{
    font-size:24px;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:12px;
}

</style>
</head>

<body>

<header>
<h2>⚡ 雷雨危険度モニター</h2>
</header>

<div class="container">

<div class="card">

<label>

<input
type="checkbox"
id="autoUpdate"
checked>

5分ごと自動更新

</label>

<br><br>

<button id="refreshBtn">
更新
</button>

<button onclick="openNowcast()">
雨雲の動き
</button>

<button onclick="openThunder()">
雷・竜巻
</button>

<div
id="lastUpdate"
class="small">
-
</div>

</div>

<div class="card">

<h3>現在地</h3>

<div id="place">
取得中...
</div>

</div>

<div
id="rainCard"
class="card">

<h3>降水量</h3>

<div
id="rain"
class="value">

--
</div>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let marker;
let timer;

function updateTime(){

 document.getElementById("lastUpdate")
 .innerText =
 "最終更新: " +
 new Date().toLocaleString();

}

function openNowcast(){

 window.open(
  "https://www.jma.go.jp/bosai/nowc/",
  "_blank"
 );

}

function openThunder(){

 window.open(
  "https://www.jma.go.jp/bosai/nowc/",
  "_blank"
 );

}

async function update(){

 navigator.geolocation.getCurrentPosition(
  success,
  error,
  {
   enableHighAccuracy:true,
   timeout:10000
  }
 );

}

async function success(position){

 const lat =
 position.coords.latitude;

 const lon =
 position.coords.longitude;

 if(!map){

  map =
  L.map("map")
  .setView(
   [lat,lon],
   11
  );

  L.tileLayer(
   "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
   {
    attribution:
    "© OpenStreetMap"
   }
  ).addTo(map);

 }

 if(marker){

  map.removeLayer(marker);

 }

 marker =
 L.marker([lat,lon])
 .addTo(map);

 map.setView(
  [lat,lon],
  11
 );

 try{

  const geoUrl =
   `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

  const geoRes =
   await fetch(geoUrl);

  const geoData =
   await geoRes.json();

  document.getElementById("place")
  .innerHTML =
  geoData.display_name;

 }catch{

  document.getElementById("place")
  .innerHTML =
  `${lat}, ${lon}`;

 }

 try{

  const weatherUrl =
  `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=rain`;

  const weatherRes =
   await fetch(weatherUrl);

  const weatherData =
   await weatherRes.json();

  const rain =
   weatherData.current.rain || 0;

  document.getElementById("rain")
   .innerHTML =
   rain + " mm/h";

  const card =
   document.getElementById(
   "rainCard"
   );

  card.className =
  "card";

  if(rain >= 10){

   card.classList.add(
    "warning"
   );

  }

  if(rain >= 20){

   card.classList.remove(
    "warning"
   );

   card.classList.add(
    "danger"
   );

  }

 }catch{

  document.getElementById("rain")
   .innerHTML =
   "取得失敗";

 }

 updateTime();

}

function error(){

 alert(
  "位置情報を取得できません"
 );

}

document
.getElementById(
 "refreshBtn"
)
.addEventListener(
 "click",
 update
);

document
.getElementById(
 "autoUpdate"
)
.addEventListener(
 "change",
 function(){

  if(this.checked){

   timer =
   setInterval(
    update,
    300000
   );

  }else{

   clearInterval(
    timer
   );

  }

 }
);

timer =
setInterval(
 update,
 300000
);

update();

</script>

</body>
</html>

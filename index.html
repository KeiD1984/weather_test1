<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1">

<title>
降雨監視モニター
</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
 margin:0;
 font-family:sans-serif;
 background:#f3f3f3;
}

header{
 background:#1565c0;
 color:white;
 text-align:center;
 padding:10px;
}

#map{
 height:70vh;
 width:100%;
}

.card{
 background:white;
 margin:10px;
 padding:10px;
 border-radius:8px;
 box-shadow:
 0 2px 4px rgba(0,0,0,.2);
}

button{

 background:#1565c0;
 color:white;

 border:none;

 padding:10px;

 margin:4px;

 border-radius:5px;

 cursor:pointer;
}

button:hover{
 background:#1976d2;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 border:1px solid #ccc;
 padding:6px;
 text-align:center;
}

</style>

</head>

<body>

<header>

<h2>
☔ 降雨監視モニター
</h2>

</header>

<div id="map"></div>

<div class="card">

<h3>
気象庁ナウキャスト
</h3>

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/nowc/',
  '_blank'
 )">

☔ 雨雲の動き

</button>

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/thunder/',
  '_blank'
 )">

⚡ 雷ナウキャスト

</button>

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/tornado/',
  '_blank'
 )">

🌪 竜巻発生確度

</button>

</div>

<div class="card">

<h3>
監視地点
</h3>

<table>

<tr>
<th>地点</th>
<th>降雨状況</th>
<th>雷</th>
<th>竜巻</th>
<th>地図</th>
</tr>

<tbody id="siteTable">
</tbody>

</table>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const points = [

{
 name:"広島駅",
 lat:34.3977,
 lon:132.4757
},

{
 name:"平和記念公園",
 lat:34.3929,
 lon:132.4523
},

{
 name:"宮島",
 lat:34.2954,
 lon:132.3198
},

{
 name:"広島空港",
 lat:34.4361,
 lon:132.9194
},

{
 name:"大和ミュージアム(呉市)",
 lat:34.2365,
 lon:132.5656
},

{
 name:"福山駅",
 lat:34.4897,
 lon:133.3625
},

{
 name:"宮脇写真館(三次市)",
 lat:34.8057,
 lon:132.8514
}

];

const map =
L.map("map")
.setView(
 [34.40,132.46],
 9
);

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:"© OpenStreetMap"
 }
).addTo(map);

function moveToPoint(
 lat,
 lon
){

 map.setView(
  [lat,lon],
  12
 );

}

const tbody =
document.getElementById(
 "siteTable"
);

points.forEach(
 p=>{

  L.circleMarker(
   [p.lat,p.lon],
   {
    radius:8,
    fillColor:"#000000",
    color:"#ffffff",
    weight:2,
    fillOpacity:1
   }
  )
  .addTo(map)
  .bindTooltip(
   p.name,
   {
    permanent:true,
    direction:"top"
   }
  );

  tbody.innerHTML += `
   <tr>
    <td>${p.name}</td>
    <td>-</td>
    <td>-</td>
    <td>-</td>
    <td>
     <button
      onclick="
      moveToPoint(
       ${p.lat},
       ${p.lon}
      )">
      📍
     </button>
    </td>
   </tr>
  `;

 }
);


async function testPixelRead(){

 try{

  const validTime =
  "20261109111000";

  const url =
  `https://www.jma.go.jp/bosai/jmatile/data/nowc/${validTime}/none/${validTime}/surf/hrpns/9/455/202.png`;

  console.log(
   "URL",
   url
  );

  const res =
  await fetch(url);

  console.log(
   "PNG fetch status",
   res.status
  );

  const blob =
  await res.blob();

  console.log(
   "blob",
   blob
  );

  const img =
  new Image();

  img.onload =
  function(){

   console.log(
    "BLOB IMAGE LOADED"
   );

  };

  img.onerror =
  function(){

   console.log(
    "BLOB IMAGE ERROR"
   );

  };

  img.src =
  URL.createObjectURL(
   blob
  );

 }
 catch(e){

  console.error(
   e
  );

 }

}



testPixelRead();

function checkTilePosition(){

 const lat = 34.3977;
 const lon = 132.4757;

 const zoom = 8;

 const point =
 map.project(
  [lat, lon],
  zoom
 );

 console.log(
  "pixel",
  point
 );

 const tileX =
 Math.floor(
  point.x / 256
 );

 const tileY =
 Math.floor(
  point.y / 256
 );

 console.log(
  "tile",
  zoom,
  tileX,
  tileY
 );

}

checkTilePosition();

</script>

</body>
</html>

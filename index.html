async function getLatestTime(){

 const url =
  "https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json";

  await fetch(url);

}

function subtractMinutes(
 yyyymmddhhmmss,
 minutes
){

 const d = new Date(
  Number(yyyymmddhhmmss.slice(0,4)),
  Number(yyyymmddhhmmss.slice(4,6))-1,
  Number(yyyymmddhhmmss.slice(6,8)),
  Number(yyyymmddhhmmss.slice(8,10)),
  Number(yyyymmddhhmmss.slice(10,12)),
  Number(yyyymmddhhmmss.slice(12,14))
 );

 d.setMinutes(
  d.getMinutes() - minutes
 );

 const pad =
  n => String(n).padStart(2,"0");

 return (
  d.getFullYear() +
  pad(d.getMonth()+1) +
  pad(d.getDate()) +
  pad(d.getHours()) +
  pad(d.getMinutes()) +
  pad(d.getSeconds())
 );
}

 );

 if(!res.ok){

   "取得失敗",
   url
  );

  await res.blob();

 console.log(
  "blob",

 );

return rgb;

}

async function getThunderRgb(p){

 const latestTime =
  await getLatestTime();

 let res = null;

 for(
  let back=0;
  back<=60;
  back+=5
 ){

  const validTime =
   subtractMinutes(
    latestTime,
    back
   );

  const url =
   `https://www.jma.go.jp/bosai/jmatile/data/nowc/${validTime}/none/${validTime}/surf/thns/8/${p.tileX}/${p.tileY}.png`;

  const testRes =
   await fetch(url);

  console.log(
   "THUNDER CHECK",
   validTime,
   testRes.status
  );

  if(testRes.ok){

   console.log(
    "THUNDER USE",
    validTime
   );

   res = testRes;

   break;
  }
 }

 if(!res){
  return [0,0,0,0];
 }

 const blob =
  await res.blob();


 const img =
  await createImageBitmap(blob);

 const canvas =
  document.createElement("canvas");

 canvas.width = 256;
 canvas.height = 256;

 const ctx =
  canvas.getContext("2d");

 ctx.drawImage(
  img,
  0,
  0
 );


 for(let dx=-15; dx<=15; dx++){
 for(let dy=-15; dy<=15; dy++){

  const data =
   ctx.getImageData(
    p.pixelX + dx,
    p.pixelY + dy,
    1,
    1
   ).data;

  if(data[3] > 0){

   console.log(
    "THUNDER HIT",
    p.name,
    dx,
    dy,
    data[0],
    data[1],
    data[2],
    data[3]
   );

   return data;
  }
 }
}

return [0,0,0,0];

}

async function addLatLonPoint(){

 const lat =
 Number(
  document.getElementById(
   "latInput"
  ).value
 );

 const lon =
 Number(
  document.getElementById(
   "lonInput"
  ).value
 );

 if(
  isNaN(lat) ||
  isNaN(lon)
 ){

  alert(
   "緯度経度を入力してください"
  );

  return;
 }

  map.setView(
  [lat,lon],
  12
 );

 const reverseUrl =
  `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

 const reverseRes =
  await fetch(reverseUrl);

 const reverseData =
  await reverseRes.json();

 const address =
  reverseData.display_name;

 const placeName =

  reverseData.name ||

  reverseData.address?.tourism ||

  reverseData.address?.attraction ||

  reverseData.address?.building ||

  reverseData.address?.amenity ||

  reverseData.display_name.split(",")[0] ||

  "追加地点";

 const oldPoint =
 points.find(
  p => p.isExtraPoint
 );

 if(oldPoint){

  if(oldPoint.marker){

   map.removeLayer(
    oldPoint.marker
   );

  }

  const oldCell =
 document.getElementById(
  `current-${oldPoint.name}`
 );

  if(oldCell){

   oldCell.closest(
    "tr"
   ).remove();

  }

 }

 const index =
  points.findIndex(
   p => p.isExtraPoint
  );

 if(index >= 0){

  points.splice(
   index,
   1
  );

 }

 const p = {

 name:placeName,

 address:address,

 lat:lat,

 lon:lon,

 isExtraPoint:true

};

 points.push(p);

 const zoom = 8;

 const point =
  map.project(
   [p.lat,p.lon],
   zoom
  );

 p.tileX =
  Math.floor(
   point.x / 256
  );

 p.tileY =
  Math.floor(
   point.y / 256
  );

 p.pixelX =
  Math.floor(
   point.x % 256
  );

 p.pixelY =
  Math.floor(
   point.y % 256
  );

 addMonitoringPoint(
  p
 );

 testAllPoints();

}

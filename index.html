<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>降雨監視モニター</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
 margin:0;
 font-family:sans-serif;
 background:#f3f3f3;
}

header{
 background:#1565c0;
 color:white;
 text-align:center;
 padding:10px;
}

#map{
 height:75vh;
 width:100%;
}

.card{
 background:white;
 margin:10px;
 padding:10px;
 border-radius:8px;
 box-shadow:0 2px 4px rgba(0,0,0,.2);
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 border:1px solid #ccc;
 padding:6px;
 text-align:center;
}

</style>

</head>

<body>

<header>
<h2>☔降雨監視モニター</h2>
</header>

<div id="map"></div>

<div class="card">

<h3>監視地点</h3>

<table>

<tr>
<th>地点</th>
<th>降雨状況</th>
<th>雷</th>
<th>竜巻</th>
</tr>

<tr>
<td>広島駅</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>平和記念公園</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>宮島</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>広島空港</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>大和ミュージアム(呉市)</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>福山駅</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

<tr>
<td>宮脇写真館(三次市)</td>
<td>-</td>
<td>-</td>
<td>-</td>
</tr>

</table>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const fixedPoints = [

{
 name:"広島駅",
 lat:34.3977,
 lon:132.4757
},

{
 name:"平和記念公園",
 lat:34.3929,
 lon:132.4523
},

{
 name:"宮島",
 lat:34.2954,
 lon:132.3198
},

{
  name:"広島空港",
  lat:34.4361,
  lon:132.9194
 },
 {
  name:"大和ミュージアム(呉市)",
  lat:34.2365,
  lon:132.5656
 },
 {
  name:"福山駅",
  lat:34.4897,
  lon:133.3625
 },
 {
  name:"宮脇写真館(三次市)",
  lat:34.8057,
  lon:132.8514
 }

];

let nowcastLayer = null;

const map = L.map("map")
.setView(
 [34.40,132.46],
 9
);

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:"© OpenStreetMap"
 }
).addTo(map);

fixedPoints.forEach(p=>{

 L.circleMarker(
  [p.lat,p.lon],
  {
   radius:8,
   fillColor:"#000000",
   color:"#ffffff",
   weight:2,
   fillOpacity:1
  }
 )
 .addTo(map)
 .bindPopup(
  p.name
 );

});

async function loadNowcastLayer(){

 try{

  const res =
  await fetch(
   "https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json"
  );


const times =
await res.json();

console.log(
 "times =",
 times
);

const latest =
times[times.length - 1];

console.log(
 "latest =",
 latest
);

console.log(
 "latest(JSON) =",
 JSON.stringify(
  latest,
  null,
  2
 )
);

Object.keys(latest).forEach(key => {

 console.log(
  key,
  latest[key]
 );

});

const validTime =
latest.validtime;

console.log(
 "validTime =",
 validTime
);


console.log(validTime);

  if(nowcastLayer){

   map.removeLayer(
    nowcastLayer
   );

  }

  nowcastLayer =
  L.tileLayer(

   `https://www.jma.go.jp/bosai/jmatile/data/nowc/${validTime}/none/${validTime}/surf/hrpns/{z}/{x}/{y}.png`,

   {
    opacity:0.55,
    attribution:"© 気象庁"
   }

  );

  nowcastLayer.addTo(map);

 }
 catch(e){

  console.error(
   "Nowcast Error",
   e
  );

 }

}

loadNowcastLayer();

setInterval(
 loadNowcastLayer,
 300000
);

/*
 Ver2次工程

 ① 気象庁降水ナウキャスト
 ② 雷ナウキャスト
 ③ 竜巻発生確度ナウキャスト
 ④ 監視地点の色判定
 ⑤ 表へ反映

*/

</script>

</body>
</html>

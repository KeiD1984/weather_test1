<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1">

<title>
降雨監視モニター
</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
 margin:0;
 font-family:sans-serif;
 background:#f3f3f3;
}

header{
 background:#1565c0;
 color:white;
 text-align:center;
 padding:10px;
}

header h2{

 font-size:18px;

 margin:5px 0;

}

#map{

 height:50vh;

 width:95%;

 margin:10px auto;

 border:1px solid #ccc;

 border-radius:8px;

}

.card{
 background:white;
 margin:10px;
 padding:10px;
 border-radius:8px;
 box-shadow:
 0 2px 4px rgba(0,0,0,.2);
}

button{

 background:#1565c0;
 color:white;

 border:none;

 padding:10px;

 margin:4px;

 border-radius:5px;

 cursor:pointer;
}

button:hover{
 background:#1976d2;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 border:1px solid #ccc;
 padding:6px;
 text-align:center;
}

.linkButtons{

 display:flex;

 flex-wrap:wrap;

 gap:8px;

 margin-top:10px;

}

.linkButtons button{

 flex:1;

 min-width:140px;

}

</style>

</head>

<body>

<header>

<h2>
☔ 降雨監視モニターE
</h2>

</header>

<div id="map"></div>


<table>

<tr>

<td>

<label>

<input
 type="checkbox"
 id="autoUpdateCheck"
 checked
 onchange="toggleAutoUpdate()">

自動更新（5分）

</label>

</td>

<td>

<button
 onclick="testAllPoints()">

今すぐ更新

</button>

</td>

</tr>


<tr>

<td>

<input
 id="addressInput"
 type="text"
 placeholder="地点入力">

</td>

<td>

<button
 onclick="addAddressPoint()">

地名で地点追加

</button>

</td>

</tr>

<tr>

<td>

緯度

<input
 id="latInput"
 type="number"
 step="0.0001"
 placeholder="34.3977">

経度

<input
 id="lonInput"
 type="number"
 step="0.0001"
 placeholder="132.4757">

</td>

<td>

<button
 onclick="addLatLonPoint()">

緯度経度で地点追加

</button>

</td>

</tr>

</table>


<div id="lastUpdate">

更新：
----

</div>


</div>

<div class="card">

<h3>

監視地点

<button
 onclick="moveToCurrentLocation()">

📍現在地

</button>

</h3>


<table>

<tr>

<th>地点</th>

<th>

現在

<br>

<span id="currentTime">

--

</span>

</th>

<th>

予報

<br>

<select id="forecastMinutes">

<option value="10">10分後</option>
<option value="20">20分後</option>
<option value="30">30分後</option>
<option value="40">40分後</option>
<option value="50">50分後</option>
<option value="60">60分後</option>

</select>

</th>


<th>雷</th>
<th>竜巻</th>
  
</tr>

<tbody id="siteTable">
</tbody>

</table>

</div>

<div class="card">

<h3>
気象庁ナウキャスト
</h3>

<div class="linkButtons">

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/nowc/',
  '_blank'
 )">

☔ 雨雲の動き

</button>

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/map.html#contents=thns',
  '_blank'
 )">

⚡ 雷ナウキャスト

</button>

<button
 onclick="window.open(
  'https://www.jma.go.jp/bosai/map.html#contents=tornado',
  '_blank'
 )">

🌪 竜巻発生確度

</button>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let autoUpdate = true;
let updateTimer = null;

const points = [

{
 name:"広島駅",
 lat:34.3977,
 lon:132.4757
},

{
 name:"平和記念公園",
 lat:34.3929,
 lon:132.4523
},

{
 name:"宮島",
 lat:34.2954,
 lon:132.3198
},

{
 name:"広島空港",
 lat:34.4361,
 lon:132.9194
},

{
 name:"大和ミュージアム(呉市)",
 lat:34.2365,
 lon:132.5656
},

{
 name:"福山駅",
 lat:34.4897,
 lon:133.3625
},

{
 name:"宮脇写真館(三次市)",
 lat:34.8057,
 lon:132.8514
}

];

const map =
L.map("map")
.setView(
 [34.40,132.46],
 9
);

L.tileLayer(
 "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  attribution:"© OpenStreetMap"
 }
).addTo(map);

function moveToPoint(
 lat,
 lon
){

 map.setView(
  [lat,lon],
  12
 );

}

async function moveToCurrentLocation(){





 navigator.geolocation.getCurrentPosition(
  
  async (pos)=>{

   const lat =
   pos.coords.latitude;

   const lon =
   pos.coords.longitude;

const reverseUrl =
`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

const reverseRes =
 await fetch(reverseUrl);

const reverseData =
 await reverseRes.json();

const currentAddress =
 reverseData.display_name;

map.setView(
 [lat,lon],
 12
);

const exists =
 points.find(
  p => p.name === "現在地"
 );

if(exists){

 exists.lat = lat;
 exists.lon = lon;

 exists.address =
  currentAddress;

const nameCell =
 document.getElementById(
  "name-現在地"
 );

if(nameCell){

 nameCell.innerHTML = `
  現在地
  <br>
  <small>
   ${currentAddress}
  </small>
 `;

}

 const zoom = 8;

 const point =
 map.project(
  [lat,lon],
  zoom
 );

 exists.tileX =
 Math.floor(point.x / 256);

 exists.tileY =
 Math.floor(point.y / 256);

 exists.pixelX =
 Math.floor(point.x % 256);

 exists.pixelY =
 Math.floor(point.y % 256);

 exists.marker.setLatLng(
  [lat,lon]
 );

 exists.marker.setStyle({

  color:"#ff0000",

  weight:3

 });

 testAllPoints();

 return;

}

const p = {

 name:"現在地",

 address:currentAddress,

 lat:lat,

 lon:lon,

 isCurrentLocation:true

};

points.push(p);


   const zoom = 8;

   const point =
   map.project(
    [lat,lon],
    zoom
   );

   p.tileX =
   Math.floor(
    point.x / 256
   );

   p.tileY =
   Math.floor(
    point.y / 256
   );

   p.pixelX =
   Math.floor(
    point.x % 256
   );

   p.pixelY =
   Math.floor(
    point.y % 256
   );

if(p.name === "現在地"){

 p.isCurrentLocation = true;

}

   addMonitoringPoint(
    p
   );

   testAllPoints();

  }

 );

}


const tbody =
document.getElementById(
 "siteTable"
);

function addMonitoringPoint(p){

 p.marker =
 L.circleMarker(
  [p.lat,p.lon],

{
 radius:10,
 fillColor:"#cccccc",

 color:
  p.isCurrentLocation
   ? "#ff0000"
   : "#ffffff",

 weight:
  p.isCurrentLocation
   ? 3
   : 2,

 fillOpacity:1
}

 )
 .addTo(map)
 .bindTooltip(
  p.name,
  {
   permanent:true,
   direction:"top"
  }
 );

tbody.innerHTML += `

<tr>

<td id="name-${p.name}">

${p.name}

<br>

<small>
${p.address || ""}
</small>

</td>

<td id="current-${p.name}">
取得中...
</td>

<td id="future-${p.name}">
取得中...
</td>

<td>
-
</td>

<td>
-
</td>

</tr>

`;

}

points.forEach(
 p => addMonitoringPoint(p)
);


function buildPointInfo(){

 points.forEach(p=>{

  const zoom = 8;

  const point =
  map.project(
   [p.lat,p.lon],
   zoom
  );

  p.tileX =
  Math.floor(
   point.x / 256
  );

  p.tileY =
  Math.floor(
   point.y / 256
  );

  p.pixelX =
  Math.floor(
   point.x % 256
  );

  p.pixelY =
  Math.floor(
   point.y % 256
  );

 console.log(
 p.name,
 p.tileX,
 p.tileY,
 p.pixelX,
 p.pixelY
);


 });

}

buildPointInfo();


async function getLatestTime(){

 const url =
 "https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json";

 const res =
 await fetch(url);

 const json =
 await res.json();

console.log(
 json.slice(0,10)
);


 return json[0].basetime;

}

async function getPointRgb(p){

const validTime =
 await getLatestTime();

 const url =
 `https://www.jma.go.jp/bosai/jmatile/data/nowc/${validTime}/none/${validTime}/surf/hrpns/8/${p.tileX}/${p.tileY}.png`;

 const res =
 await fetch(url);

 const blob =
 await res.blob();

 const img =
 await createImageBitmap(blob);

 const canvas =
 document.createElement("canvas");

 canvas.width = 256;
 canvas.height = 256;

 const ctx =
 canvas.getContext("2d");

 ctx.drawImage(
  img,
  0,
  0
 );

 const rgb =
 ctx.getImageData(
  p.pixelX,
  p.pixelY,
  1,
  1
 ).data;

 return rgb;

}

function rainText(rgb){

 if(rgb[3] === 0){
  return "降雨なし";
 }

 const r = rgb[0];
 const g = rgb[1];
 const b = rgb[2];

 if(
  r === 160 &&
  g === 210 &&
  b === 255
 ){
  return "1～5mm/h";
 }

 return `${r},${g},${b}`;

}

function rainColor(rgb){

 if(rgb[3] === 0){
  return "#ffffff";
 }

 if(
  rgb[0] === 160 &&
  rgb[1] === 210 &&
  rgb[2] === 255
 ){
  return "#a0d2ff";
 }

 return "#66ccff";

}

function startAutoUpdate(){

 if(updateTimer){
  clearInterval(updateTimer);
 }

 updateTimer =
 setInterval(
  testAllPoints,
  300000
 );

}

function toggleAutoUpdate(){

 autoUpdate =
 !autoUpdate;


 if(autoUpdate){

  startAutoUpdate();


 }else{

  clearInterval(
   updateTimer
  );

 }

}

async function addLatLonPoint(){

 const lat =
 Number(
  document.getElementById(
   "latInput"
  ).value
 );

 const lon =
 Number(
  document.getElementById(
   "lonInput"
  ).value
 );

 if(
  isNaN(lat) ||
  isNaN(lon)
 ){

  alert(
   "緯度経度を入力してください"
  );

  return;
 }

  map.setView(
  [lat,lon],
  12
 );

 const reverseUrl =
  `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;

 const reverseRes =
  await fetch(reverseUrl);

 const reverseData =
  await reverseRes.json();

 const address =
  reverseData.display_name;

 const placeName =

  reverseData.name ||

  reverseData.address?.tourism ||

  reverseData.address?.attraction ||

  reverseData.address?.building ||

  reverseData.address?.amenity ||

  reverseData.display_name.split(",")[0] ||

  "追加地点";

 const oldPoint =
 points.find(
  p => p.isExtraPoint
 );

 if(oldPoint){

  if(oldPoint.marker){

   map.removeLayer(
    oldPoint.marker
   );

  }

  const oldCell =
 document.getElementById(
  `current-${oldPoint.name}`
 );

  if(oldCell){

   oldCell.closest(
    "tr"
   ).remove();

  }

 }

 const index =
  points.findIndex(
   p => p.isExtraPoint
  );

 if(index >= 0){

  points.splice(
   index,
   1
  );

 }

 const p = {

 name:placeName,

 address:address,

 lat:lat,

 lon:lon,

 isExtraPoint:true

};

 points.push(p);

 const zoom = 8;

 const point =
  map.project(
   [p.lat,p.lon],
   zoom
  );

 p.tileX =
  Math.floor(
   point.x / 256
  );

 p.tileY =
  Math.floor(
   point.y / 256
  );

 p.pixelX =
  Math.floor(
   point.x % 256
  );

 p.pixelY =
  Math.floor(
   point.y % 256
  );

 addMonitoringPoint(
  p
 );

 testAllPoints();

}

async function addAddressPoint(){

 const address =
 document.getElementById(
  "addressInput"
 ).value;

 const oldPoint =
 points.find(
  p => p.isExtraPoint
 );

 if(oldPoint){

 if(oldPoint.marker){

  map.removeLayer(
   oldPoint.marker
  );

 }

 const oldCell =
 document.getElementById(
  `current-${oldPoint.name}`
 );

 if(oldCell){

  oldCell.closest(
   "tr"
  ).remove();

 }

}


const index =
 points.findIndex(
  p => p.isExtraPoint
 );

if(index >= 0){

 points.splice(
  index,
  1
 );

}


 if(!address)return;

 const url =
 `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`;

 const res =
 await fetch(url);

 const data =
 await res.json();

 const placeName =

 data[0].name ||

 address;

 if(data.length===0){

  alert("住所が見つかりません");

  return;
 }

 map.setView(
  [
   Number(data[0].lat),
   Number(data[0].lon)
  ],
  12
 );

const p = {

 name:placeName,

 address:address,

 lat:Number(data[0].lat),

 lon:Number(data[0].lon),

 isExtraPoint:true

};

points.push(p);

const zoom = 8;

const point =
 map.project(
  [p.lat,p.lon],
  zoom
 );

p.tileX =
 Math.floor(
  point.x / 256
 );

p.tileY =
 Math.floor(
  point.y / 256
 );

p.pixelX =
 Math.floor(
  point.x % 256
 );

p.pixelY =
 Math.floor(
  point.y % 256
 );

addMonitoringPoint(
 p
);

testAllPoints();

}


async function testAllPoints(){

document.getElementById(
 "lastUpdate"
).textContent =
 "更新中...";

 for(const p of points){

  const rgb =
  await getPointRgb(p);

  console.log(
 new Date().toLocaleTimeString(),
 p.name,
 rgb[0],
 rgb[1],
 rgb[2],
 rgb[3]
);

const currentCell =
 document.getElementById(
  `current-${p.name}`
 );

 currentCell.textContent =
 rainText(rgb);

currentCell.style.backgroundColor =
 rainColor(rgb);

const futureCell =
 document.getElementById(
  `future-${p.name}`
 );

futureCell.textContent =
 rainText(rgb);

futureCell.style.backgroundColor =
 rainColor(rgb);


  p.marker.setStyle({
   fillColor: rainColor(rgb)
  });

 }

 const updateTime =
 new Date().toLocaleTimeString(
  "ja-JP"
 );

document.getElementById(
 "lastUpdate"
).textContent =
 "更新: " +
 updateTime;

document.getElementById(
 "currentTime"
).textContent =
 updateTime;

}

points.forEach(p=>{

 console.log(
  p.name,
  p.tileX,
  p.tileY,
  p.pixelX,
  p.pixelY
 );

});

console.log(points);

testAllPoints();

startAutoUpdate();


</script>

</body>
</html>
